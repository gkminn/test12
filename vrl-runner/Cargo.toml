[package]
name = "vrl-runner"
version = "0.1.0"
edition = "2021"
description = "Browser-side VRL runner for the Vector VRL test web app"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vrl = { version = "0.27", default-features = false, features = ["compiler", "stdlib", "value"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-utils = { version = "0.2", features = ["serde"] }
web-sys = { version = "0.3", features = ["Window", "Performance"] }
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
